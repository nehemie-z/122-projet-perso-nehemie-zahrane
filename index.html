<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuisine Restaurant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-my">My</span>
    <span class="logo-main">Cuisine</span>
    <span class="logo-star">★</span>
    <span class="logo-sub">Restaurant</span>
  </div>
  <p class="header-sub">Ingrédients & Recettes du Monde</p>
</header>

<nav>
  <button class="nav-btn active" data-tab="shop">🛒 Ingrédients</button>
  <button class="nav-btn" data-tab="recipes">📜 Recettes</button>
  <button class="nav-btn" data-tab="craft">➕ Ajouter un plat</button>
</nav>

<main>

  <section id="tab-shop" class="tab-content active">
    <div class="controls">
      <button id="btn-sort">Trier par prix ↓ (DESC)</button>
      <input type="text" id="search" placeholder="🔍 Rechercher un ingrédient...">
      <select id="filter-category">
        <option value="all">Toutes catégories</option>
        <option value="Soin">💚 Soin</option>
        <option value="Buff">💪 Buff</option>
        <option value="Feu">🔥 Feu</option>
        <option value="Glace">❄️ Glace</option>
        <option value="Vitesse">⚡ Vitesse</option>
        <option value="Eau">💧 Eau</option>
        <option value="Snack">🍿 Snack</option>
        <option value="Spécial">⭐ Spécial</option>
      </select>
    </div>
    <ul id="list"></ul>
  </section>

  <section id="tab-recipes" class="tab-content">
    <h2>📜 Livre de Recettes</h2>
    <div id="recipes-list"></div>
  </section>

  <section id="tab-craft" class="tab-content">
    <h2>➕ Ajouter un plat</h2>
    <form id="form-add">

      <div class="form-group">
        <label>Image</label>
        <div id="drop-zone" class="drop-zone">
          <img id="preview-img" class="preview-img hidden" src="" alt="preview">
          <span id="drop-text">🖼️ Glisse une image ici ou clique pour choisir</span>
          <input type="file" id="input-image" accept="image/*">
        </div>
      </div>

      <div class="form-group">
        <label for="input-name">Nom</label>
        <input type="text" id="input-name" placeholder="Ex : Mangue" required>
      </div>

      <div class="form-group">
        <label for="input-category">Catégorie</label>
        <select id="input-category">
          <option value="Soin">Soin</option>
          <option value="Buff">Buff</option>
          <option value="Feu">Feu</option>
          <option value="Glace">Glace</option>
          <option value="Vitesse">Vitesse</option>
          <option value="Eau">Eau</option>
          <option value="Snack">Snack</option>
          <option value="Spécial">Spécial</option>
        </select>
      </div>

      <div class="form-group">
        <label for="input-price"><img src="ressources/Coin.png" class="stat-icon"> Prix (Or)</label>
        <input type="number" id="input-price" min="1" placeholder="Ex : 80" required>
      </div>

      <div class="form-group">
        <label for="input-hp">❤️ HP</label>
        <input type="number" id="input-hp" min="0" placeholder="0">
      </div>

      <div class="form-group">
        <label for="input-atk"><img src="ressources/Harold4.png" class="stat-icon"> ATK</label>
        <input type="number" id="input-atk" min="0" placeholder="0">
      </div>

      <div class="form-group">
        <label for="input-def"><img src="ressources/Shield1.png" class="stat-icon"> DEF</label>
        <input type="number" id="input-def" min="0" placeholder="0">
      </div>

      <div class="form-group">
        <label for="input-agi"><img src="ressources/Harold3.png" class="stat-icon"> AGI</label>
        <input type="number" id="input-agi" min="0" placeholder="0">
      </div>

      <div class="form-group">
        <label for="input-mp">⚡ MP</label>
        <input type="number" id="input-mp" min="0" placeholder="0">
      </div>

      <button type="submit">Ajouter à la boutique</button>
    </form>
  </section>

</main>

<footer>
  <p>⚗️ My Cuisine Restaurant</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
